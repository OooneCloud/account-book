<!DOCTYPE html>
<!-- index.html — 前端记录页(成员E 谢玲洁)
     主页 = 顶部小结卡片 + 左侧记账表单 + 右侧最近10笔记录 -->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轻松记账本</title>
  <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-success mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">📒 轻松记账本</span>
    <ul class="navbar-nav flex-row gap-3">
      <li class="nav-item"><a class="nav-link active" href="/">记账</a></li>
      <li class="nav-item"><a class="nav-link" href="/stats">统计</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <!-- 本月小结三张卡片 -->
  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="card text-center summary-card">
      <div class="card-body"><div class="text-muted">本月支出(元)</div>
        <h4 class="text-danger" id="sum-expense">0.00</h4></div></div></div>
    <div class="col-md-4"><div class="card text-center summary-card">
      <div class="card-body"><div class="text-muted">本月收入(元)</div>
        <h4 class="text-success" id="sum-income">0.00</h4></div></div></div>
    <div class="col-md-4"><div class="card text-center summary-card">
      <div class="card-body"><div class="text-muted">本月结余(元)</div>
        <h4 id="sum-balance">0.00</h4></div></div></div>
  </div>

  <div class="row g-4">
    <!-- 左侧:记账表单 -->
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-bold">记一笔</div>
        <div class="card-body">
          <form id="record-form">
            <div class="mb-3">
              <label class="form-label">类型</label>
              <div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="type" value="expense" checked>
                  <label class="form-check-label text-danger">支出</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="type" value="income">
                  <label class="form-check-label text-success">收入</label>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">日期</label>
              <input type="date" class="form-control" name="date" required>
            </div>
            <div class="mb-3">
              <label class="form-label">金额(元)</label>
              <input type="number" class="form-control" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
            </div>
            <div class="mb-3">
              <label class="form-label">类别</label>
              <select class="form-select" name="category" id="category"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">备注</label>
              <input type="text" class="form-control" name="note" maxlength="50" placeholder="选填,最多50字">
            </div>
            <button type="submit" class="btn btn-success w-100">保存</button>
          </form>
        </div>
      </div>
    </div>

    <!-- 右侧:最近10笔 -->
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <span class="fw-bold">最近记录</span>
          <a class="btn btn-outline-secondary btn-sm" href="/api/export/csv">导出CSV</a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr><th>日期</th><th>类型</th><th>类别</th><th class="text-end">金额(元)</th><th>备注</th><th></th></tr>
            </thead>
            <tbody id="record-tbody">
              <tr><td colspan="6" class="text-center text-muted">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/main.js"></script>
</body>
</html>
