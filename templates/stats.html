<!DOCTYPE html>
<!-- stats.html — 前端统计页(成员F 王清源)
     筛选栏 + 三张 Chart.js 图表(类别占比环形图 / 每日收支对比柱状图 / 收支趋势折线图)+ 明细表 -->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计 - 轻松记账本</title>
  <script>
    document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");
  </script>
  <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-success mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">📒 轻松记账本</span>
    <ul class="navbar-nav flex-row gap-3 align-items-center">
      <li class="nav-item"><a class="nav-link" href="/">记账</a></li>
      <li class="nav-item"><a class="nav-link active" href="/stats">统计</a></li>
      <li class="nav-item"><button class="theme-btn" id="theme-btn" title="切换暗色模式">🌙</button></li>
    </ul>
  </div>
</nav>

<div class="container">
  <!-- 筛选栏:条件变化即重新查询并刷新图表 -->
  <div class="card shadow-sm mb-4">
    <div class="card-body row g-2 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label">开始日期</label>
        <div class="date-wrap empty">
          <input type="date" class="form-control" id="start">
          <span class="date-placeholder">年/月/日</span>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">结束日期</label>
        <div class="date-wrap empty">
          <input type="date" class="form-control" id="end">
          <span class="date-placeholder">年/月/日</span>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">类型</label>
        <select class="form-select" id="type">
          <option value="all">全部</option>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">金额下限</label>
        <input type="number" class="form-control" id="min-amount" min="0" step="0.01" placeholder="不限">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">金额上限</label>
        <input type="number" class="form-control" id="max-amount" min="0" step="0.01" placeholder="不限">
      </div>
      <div class="col-6 col-md-2 d-grid">
        <button class="btn btn-success" id="refresh-btn">刷新统计</button>
      </div>
    </div>
  </div>

  <p class="text-muted" id="stat-desc">当前统计:全部类型 · 共0笔 · 合计0.00元</p>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card shadow-sm h-100"><div class="card-body chart-card">
        <div class="chart-box"><canvas id="pie"></canvas></div>
      </div></div>
    </div>
    <div class="col-lg-7">
      <div class="card shadow-sm h-100"><div class="card-body chart-card">
        <div class="chart-box"><canvas id="bar"></canvas></div>
      </div></div>
    </div>
  </div>

  <div class="card shadow-sm my-4">
    <div class="card-body">
      <div class="chart-box"><canvas id="trend"></canvas></div>
    </div>
  </div>

  <div class="card shadow-sm my-4">
    <div class="card-header bg-white fw-bold">类别明细</div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>类别/日期</th><th class="text-end">金额(元)</th>
              <th class="text-end">笔数</th><th class="text-end">占比</th></tr>
        </thead>
        <tbody id="stat-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/theme.js"></script>
<script src="/static/stats.js"></script>
</body>
</html>
